<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Responsive Image Gallery</h1>

        <div class="filter-buttons">
            <button class="active" onclick="filterImages('all')">All</button>
            <button onclick="filterImages('nature')">Nature</button>
            <button onclick="filterImages('animals')">Animals</button>
            <button onclick="filterImages('cities')">Cities</button>
        </div>
    </header>

    <section class="gallery">

        <div class="image nature">
            <img src="images/img1.jpg" alt="Nature 1" onclick="openLightbox(this)">
        </div>

        <div class="image animals">
            <img src="images/img2.jpg" alt="Animal 1" onclick="openLightbox(this)">
        </div>

        <div class="image cities">
            <img src="images/img3.jpg" alt="City 1" onclick="openLightbox(this)">
        </div>

        <div class="image nature">
            <img src="images/img4.jpg" alt="Nature 2" onclick="openLightbox(this)">
        </div>

        <div class="image animals">
            <img src="images/img5.jpg" alt="Animal 2" onclick="openLightbox(this)">
        </div>

        <div class="image cities">
            <img src="images/img6.jpg" alt="City 2" onclick="openLightbox(this)">
        </div>

    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="changeImage(-1)">&#10094;</button>

        <img id="lightbox-img" src="" alt="">

        <button class="next" onclick="changeImage(1)">&#10095;</button>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
